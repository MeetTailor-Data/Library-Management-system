<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Library Management | Login & Signup</title>
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a00, #ffd000);
      padding: 20px 10px;
    }

    .container {
      width: 380px;
      max-width: 95%;
      background: #fff;
      border-radius: 15px;
      padding: 30px 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
    }

    .container h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    .tabs {
      display: flex;
      justify-content: space-around;
      margin-bottom: 20px;
    }

    .tabs button {
      width: 50%;
      padding: 10px;
      border: none;
      background: none;
      font-size: 16px;
      cursor: pointer;
      color: #555;
      border-bottom: 2px solid transparent;
    }

    .tabs button.active {
      color: #c33764;
      border-bottom: 2px solid #c33764;
    }

    form {
      display: none;
    }

    form.active {
      display: block;
    }

    .input-box {
      margin-bottom: 15px;
    }

    .input-box input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
    }

    .input-box input:focus {
      border-color: #c33764;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #ff9a00, #ff6a00);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    .guest {
      background: #fff;
      color: #ff6a00;
      border: 2px solid #ff6a00;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .footer-text {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Library Management System</h2>

    <div class="tabs">
      <button type="button" id="loginTab" class="active" onclick="showLogin()">Login</button>
      <button type="button" id="signupTab" onclick="showSignup()">Signup</button>
    </div>

    <div id="alertBox" style="display: none; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 15px; text-align: center;"></div>

    <form id="loginForm" class="active" onsubmit="event.preventDefault(); handleLogin(event);">
      <div class="input-box">
        <input type="text" name="user_id" id="loginUserId" placeholder="Student ID / Admin ID (e.g. STU101 or ADMIN01)" required />
      </div>
      <div class="input-box">
        <input type="password" name="password" id="loginPassword" placeholder="Password" required />
      </div>
      <button type="submit" class="btn">Login</button>
      <button type="button" class="btn guest" onclick="goHome()">Continue as Guest</button>
    </form>

    <form id="signupForm" onsubmit="event.preventDefault(); handleSignup(event);">
      <div class="input-box">
        <input type="text" name="full_name" id="signupName" placeholder="Full Name (e.g. Rahul Sharma)" required />
      </div>
      <div class="input-box">
        <input type="text" name="student_id" id="signupId" placeholder="Student ID (e.g. STU106)" required />
      </div>
      <div class="input-box">
        <input type="email" name="email" id="signupEmail" placeholder="Email Address (e.g. student@library.edu)" required />
      </div>
      <div class="input-box">
        <select name="department" id="signupDept" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; outline: none; background: #fff; font-size: 14px; color: #333; font-family: inherit;">
          <option value="" disabled selected>-- Select Department --</option>
          <option value="Computer Science">Computer Science</option>
          <option value="Information Technology">Information Technology</option>
          <option value="Mechanical Engg.">Mechanical Engg.</option>
          <option value="Electrical & Electronics">Electrical & Electronics</option>
          <option value="Civil Engineering">Civil Engineering</option>
          <option value="Economics">Economics</option>
          <option value="Business Administration">Business Administration</option>
          <option value="Science & Mathematics">Science & Mathematics</option>
          <option value="Literature & Arts">Literature & Arts</option>
        </select>
      </div>
      <div class="input-box">
        <select name="year" id="signupYear" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; outline: none; background: #fff; font-size: 14px; color: #333; font-family: inherit;">
          <option value="" disabled selected>-- Select Academic Year --</option>
          <option value="1st Year">1st Year</option>
          <option value="2nd Year">2nd Year</option>
          <option value="3rd Year">3rd Year</option>
          <option value="4th Year">4th Year</option>
          <option value="Final Year">Final Year</option>
          <option value="Postgraduate">Postgraduate</option>
        </select>
      </div>
      <div class="input-box">
        <input type="password" name="password" id="signupPass" placeholder="Create Password" required />
      </div>
      <div class="input-box">
        <input type="password" name="confirm_password" id="signupConfirmPass" placeholder="Confirm Password" required />
      </div>
      <button type="submit" class="btn">Create Account</button>
    </form>

    <div class="footer-text">
      <a href="index.html" style="color: #ff6a00; text-decoration: none; font-weight: 500;">&larr; Back to Home</a>
      <div style="margin-top: 8px;">© 2026 Library Management System</div>
    </div>
  </div>

  <script src="../assets/js/slms-store.js?v=20261027"></script>
  <script src="../assets/js/auth-session.js?v=20261027"></script>
  <script>

    window.addEventListener('DOMContentLoaded', () => {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('tab') === 'signup' || urlParams.get('tab') === 'register' || urlParams.get('view') === 'register') {
          showSignup();
        }
      } catch (e) {}
    });

    function showLogin() {
      document.getElementById('loginForm').classList.add('active');
      document.getElementById('signupForm').classList.remove('active');
      document.getElementById('loginTab').classList.add('active');
      document.getElementById('signupTab').classList.remove('active');
      hideAlert();
    }

    function showSignup() {
      document.getElementById('signupForm').classList.add('active');
      document.getElementById('loginForm').classList.remove('active');
      document.getElementById('signupTab').classList.add('active');
      document.getElementById('loginTab').classList.remove('active');
      hideAlert();
    }

    function showAlert(msg, isError) {
      const box = document.getElementById('alertBox');
      box.style.display = 'block';
      const cleanMsg = (typeof msg === 'string' && msg.trim()) ? msg.trim() : (isError ? 'Action failed. Please check your credentials.' : 'Operation completed successfully.');
      box.innerText = cleanMsg;
      box.style.background = isError ? '#ffebee' : '#e8f5e9';
      box.style.color = isError ? '#c62828' : '#2e7d32';
      box.style.border = isError ? '1px solid #ef9a9a' : '1px solid #a5d6a7';
    }

    function hideAlert() {
      document.getElementById('alertBox').style.display = 'none';
    }

    async function handleLogin(e) {
      if (e && e.preventDefault) e.preventDefault();
      const idInput = document.getElementById('loginUserId');
      const passInput = document.getElementById('loginPassword');
      const id = idInput ? idInput.value.trim() : '';
      const pass = passInput ? passInput.value.trim() : '';

      if (!id || !pass) {
        showAlert('Please enter your ID and password.', true);
        return false;
      }

      hideAlert();

      // Check database credentials via PHP backend
      if (window.SLMS_STORE && window.SLMS_STORE.loginUser) {
        const res = await window.SLMS_STORE.loginUser(id, pass);
        if (res && res.success && res.user) {
          const u = res.user;
          const userObj = {
            role: u.role || 'student',
            studentId: u.studentId || u.user_id,
            name: u.name,
            email: u.email,
            department: u.department || 'Computer Science',
            year: u.year || '1st Year'
          };
          setCurrentUser(userObj);

          if (userObj.role === 'admin') {
            window.location.href = 'admin-dashboard.html';
          } else {
            const urlParams = new URLSearchParams(window.location.search);
            const redirectPage = urlParams.get('redirect') || 'student-dashboard.html';
            window.location.href = redirectPage;
          }
          return false;
        } else {
          showAlert((res && res.message) ? res.message : 'Invalid User ID or Password. Please try again.', true);
          return false;
        }
      }

      showAlert('Invalid User ID or Password. Please try again.', true);
      return false;
    }

    async function handleSignup(e) {
      if (e && e.preventDefault) e.preventDefault();
      const fullName = document.getElementById('signupName').value.trim();
      const stuId = document.getElementById('signupId').value.trim().toUpperCase();
      const email = document.getElementById('signupEmail').value.trim();
      const deptSelect = document.getElementById('signupDept');
      const yearSelect = document.getElementById('signupYear');
      const department = deptSelect ? deptSelect.value : 'Computer Science';
      const year = yearSelect ? yearSelect.value : '1st Year';
      const pass = document.getElementById('signupPass').value;
      const confirmPass = document.getElementById('signupConfirmPass').value;

      if (!fullName || !stuId || !email || !pass) {
        showAlert('Please fill in all required fields.', true);
        return false;
      }

      if (!department) {
        showAlert('Please select your Department.', true);
        return false;
      }
      if (!year) {
        showAlert('Please select your Academic Year.', true);
        return false;
      }

      if (pass !== confirmPass) {
        showAlert('Passwords do not match. Please try again.', true);
        return false;
      }

      hideAlert();

      if (window.SLMS_STORE) {
        const res = await window.SLMS_STORE.addStudent({
          studentId: stuId,
          name: fullName,
          email: email,
          password: pass,
          confirm_password: confirmPass,
          department: department,
          year: year
        });
        if (!res || !res.success) {
          showAlert((res && res.message) ? res.message : 'Registration failed. Please try a different ID or email.', true);
          return false;
        }

        const newStudent = {
          role: 'student',
          studentId: stuId,
          name: fullName,
          email: email,
          department: department,
          year: year
        };

        setCurrentUser(newStudent);
        alert(`Account Created Successfully!\nWelcome to the Library, ${fullName}!\nStudent ID: ${stuId} | ${department} (${year})`);
        window.location.href = 'student-dashboard.html';
        return false;
      }
    }


    function goHome() {
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
